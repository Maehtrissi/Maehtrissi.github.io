<!doctype html>
<html lang="de-CH"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Buchungsbestätigung | Sponti</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css?v=screenshot-gradient-20261107"><style>
body{margin:0;background:#f8f3ec;color:#164d40;font-family:"DM Sans",Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;box-sizing:border-box}.panel{background:white;border-radius:26px;box-shadow:0 16px 45px #153d3020;max-width:620px;width:100%;padding:44px 34px;box-sizing:border-box;text-align:center}.mark{height:68px;width:68px;display:grid;place-items:center;border-radius:50%;background:#e9f3ed;color:#17634c;font-size:36px;margin:0 auto 18px}.panel h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:0 0 14px}.sub{color:#5e746b;line-height:1.7}.details{background:#f1f5ef;text-align:left;border-radius:16px;padding:20px;margin:25px 0}.details div{padding:8px 0;border-bottom:1px solid #dce6dc;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.details div:last-child{border-bottom:0}.details span{color:#587067}.details strong{overflow-wrap:anywhere}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.actions a{display:inline-block;background:#175b4d;color:white;text-decoration:none;padding:13px 22px;border-radius:28px;font-weight:700}.actions a.secondary{background:white;color:#175b4d;border:1px solid #175b4d}.small{font-size:13px;color:#718178;margin-top:20px}@media(max-width:500px){.panel{padding:30px 20px}.details div{display:block}.details strong{display:block;margin-top:4px}}
</style></head><body><main class="wrap"><section class="panel" aria-live="polite"><div class="mark" id="mark">…</div><h1 id="heading">Deine Zahlung wird geprüft</h1><p class="sub" id="message">Wir prüfen die Zahlungsbestätigung von Stripe. Das kann einen Moment dauern.</p><div class="details" id="details" hidden></div><div class="actions"><a href="/kurse">Weitere Kurse entdecken</a><a class="secondary" href="/">Zur Startseite</a></div><p class="small" id="note">Bitte diese Seite nicht als Zahlungsnachweis verwenden, solange die Bestätigung aussteht.</p></section></main><script type="module">
const id=new URLSearchParams(location.search).get("session_id");const heading=document.getElementById("heading"),msg=document.getElementById("message"),mark=document.getElementById("mark"),details=document.getElementById("details"),note=document.getElementById("note");const set=(h,m,s)=>{heading.textContent=h;msg.textContent=m;mark.textContent=s};const fmt=s=>new Intl.DateTimeFormat("de-CH",{dateStyle:"full",timeStyle:"short",timeZone:"Europe/Zurich"}).format(new Date(s));const row=(a,b)=>{const el=document.createElement("div"),label=document.createElement("span"),value=document.createElement("strong");label.textContent=a;value.textContent=b;el.append(label,value);details.append(el)};if(!id||!/^cs_test_[A-Za-z0-9_]{10,200}$/.test(id)){set("Keine Zahlungssitzung gefunden","Öffne die Bestätigung über den Link nach deiner Stripe-Zahlung.","!")}else{let done=false;for(let i=0;i<8&&!done;i++){try{const r=await fetch("https://ehifskiigrfpxeiruyxr.supabase.co/functions/v1/sponti-checkout-status",{method:"POST",headers:{"content-type":"application/json","apikey":"sb_publishable_ne8xIO5aoko5eW4ONLfBRQ_uyfBBhYy"},body:JSON.stringify({session_id:id})});const data=await r.json();if(!r.ok)throw Error(data.error||"Prüfung nicht verfügbar");if(data.status==="confirmed"){done=true;set("Danke für deine Buchung!","Deine Zahlung ist bestätigt und dein Platz wurde erfolgreich gebucht.","✓");details.hidden=false;row("Kurs",data.course_title);if(data.starts_at)row("Datum",fmt(data.starts_at));if(data.venue)row("Ort",data.venue);row("Personen",String(data.quantity));row("Gesamtbetrag",new Intl.NumberFormat("de-CH",{style:"currency",currency:"CHF"}).format(data.total_chf));row("Buchungsnummer",data.booking_number);note.textContent=data.email_status==="sent"?"Die Buchungsbestätigung wurde per E-Mail versendet.":"Du erhältst eine E-Mail mit den Buchungsdetails, sobald der Versand abgeschlossen ist.";break;}if(data.status==="pending"){set("Zahlung noch nicht bestätigt","Stripe hat die Zahlung noch nicht als bezahlt gemeldet. Bitte prüfe den Zahlungsstatus.","…");break;}}catch(e){if(i===7)set("Bestätigung derzeit nicht abrufbar","Bitte prüfe deine E-Mails oder kontaktiere Sponti, falls du bezahlt hast.","!");}if(i<7)await new Promise(resolve=>setTimeout(resolve,2000));}if(!done&&heading.textContent==="Deine Zahlung wird geprüft")set("Zahlung wird verarbeitet","Die Bestätigung dauert länger als erwartet. Prüfe später deine E-Mails oder kontaktiere Sponti.","…");}
</script></body></html>
